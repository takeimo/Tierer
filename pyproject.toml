[project]
name = "tierer"
version = "2026.08.28"
description = "A modernized, maintained fork of 3D Photo Inpainting using modern depth estimation and uv package manager."
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python>=4.8.0",
    "imageio>=2.33.0",
    "imageio-ffmpeg>=0.4.9",
    "vispy>=0.14.0",
    "PyQt6>=6.6.0",
    "transforms3d>=0.4.2",
    "networkx>=3.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "h5py>=3.10.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.22.0",
    "matplotlib>=3.8.0",
    "moviepy>=2.2.1",
]

[tool.uv]
# Windows/Linux向けにNVIDIA CUDA対応のPyTorch Wheelを取得する設定
# (Mac等の非CUDA環境では標準PyPIから適切なパッケージが自動選択されます)

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
